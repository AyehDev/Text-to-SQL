[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "schemagraph"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6",
    "psycopg[binary]>=3.1",
    "neo4j>=5.20",
    "networkx>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["schemagraph*"]

# The catalog queries are data files inside the package.
[tool.setuptools.package-data]
"schemagraph.extraction" = ["sql/*.sql"]
